# @file build_emscripten.yml
# @brief Solution Emscripten build Action in GitHub.
# @author Spices.

# configuration name
name: Build Emscripten

# workflow trigger
on:
  
  # On Pushed
  push:
    branches: [ "main" ]
  
  # On Pull Request
  pull_request:
    branches: [ "main" ]

# workflow jobs
jobs:
  
  # Build Job
  build:

    # Strategy
    strategy:

      # Error and Continue
      fail-fast: false 

      # Matrix Strategy
      matrix:

        # Platform: Linux
        os: [ubuntu-latest]

        # Build Mode
        build_type: [Debug, Release]

        # Include
        include:

          # Linux
          - os: ubuntu-latest
            script_entry: Emscripten
            platform: emscripten
            architecture: wasm64
            toolchain: emcc

    # Platform
    runs-on: ${{ matrix.os }}

    # Pipeline Name
    name: Build (${{ matrix.build_type }}-${{ matrix.platform }}-${{ matrix.architecture }}-${{ matrix.toolchain }})

    # Build Steps
    steps:

      # Checkout recursive
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # ============ Toolset and env ============

       # Set Emscripten
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 5.0.1
          actions-cache-folder: 'emsdk-cache'

      # Verify emsdk
      - name: Verify Emscripten
        run: emcc -v

      # Compute lowercase build type
      - name: Compute lowercase build type
        shell: bash
        run: |
          echo "BUILD_TYPE_LOWER=$(echo '${{ matrix.build_type }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # ============ Build ============

      # Build Solution (Emscripten)
      - name: Build Solution (Emscripten)
        if: matrix.platform == 'emscripten'
        shell: bash
        working-directory: ./Scripts/BuildEntry/${{ matrix.script_entry }}/
        run: bash ./build_${{ env.BUILD_TYPE_LOWER }}.sh

      # ============ Upload Artifact ============

      # Upload Build Artifact
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build_type }}-${{ matrix.platform }}-${{ matrix.architecture }}-${{ matrix.toolchain }}
          path: ./bin/${{ matrix.build_type }}-${{ matrix.platform }}-${{ matrix.architecture }}/Editor
          retention-days: 7
          if-no-files-found: warn